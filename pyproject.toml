[project]
name = "insider-trader"
version = "0.0.0"
description = "Congressional stock-disclosure mining (House first). A Black Box strategy."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pdfplumber>=0.11",   # parse House PTR PDFs
    "psycopg[binary]>=3.2",  # Neon Postgres
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insider_trader"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
